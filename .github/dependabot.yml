# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Helm charts/Kustomize overlays have no native Dependabot ecosystem - image
  # tag bumps in charts/*/values.yaml aren't covered here, only the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      # Pinned deliberately in lint-test-release.yml -- v1.6+ crashes with
      # "latest_tag: unbound variable" under skip_packaging, which fails the
      # release job after chart-releaser's own work is done and skips the OCI
      # publish. A bump to v1.7.0 slipped through in #3 and broke the 0.4.0
      # chart release. Unignore only once upstream issue 171 is fixed.
      - dependency-name: "helm/chart-releaser-action"
    groups:
      github-actions:
        patterns:
          - "actions/*"
      third-party-actions:
        patterns:
          - "*"
